<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZenCoParent — Administration</title>
  <link rel="stylesheet" href="/frontend/css/design-system.css" />
  <link rel="stylesheet" href="/frontend/css/layout.css" />
  <link rel="stylesheet" href="/frontend/css/components.css" />
</head>
<body>

<div id="app-shell" class="app-shell">
  <div class="main-content">
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Administration</h1>
        <p class="page-subtitle">Vue globale de la plateforme</p>
      </div>
    </div>
    <div class="page-body">

      <!-- KPI row -->
      <div class="grid-3" id="kpi-cards">
        <div class="stat-card">
          <div class="stat-card-icon primary">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          </div>
          <div class="stat-card-content">
            <div class="stat-card-value" id="kpi-total">—</div>
            <div class="stat-card-label">Familles totales</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon success">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          </div>
          <div class="stat-card-content">
            <div class="stat-card-value" id="kpi-active">—</div>
            <div class="stat-card-label">Familles actives</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon accent">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          </div>
          <div class="stat-card-content">
            <div class="stat-card-value" id="kpi-trial">—</div>
            <div class="stat-card-label">Créées récemment</div>
          </div>
        </div>
      </div>

      <!-- Families table -->
      <div style="margin-top: var(--space-8);">
        <div class="card" style="margin-top: var(--space-4);">
          <div class="card-header">
            <h2 class="card-title">Familles</h2>
            <input type="text" class="form-input" id="search-families" placeholder="Rechercher..." style="width:220px;" />
          </div>
          <div class="card-body" style="padding:0;">
            <div id="families-loading" class="loading-state"><div class="spinner"></div><span>Chargement...</span></div>
            <table class="table" id="families-table" style="display:none;">
              <thead>
                <tr>
                  <th>Famille</th>
                  <th>Créée le</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="families-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="/frontend/js/api.js"></script>
<script src="/frontend/js/auth.js"></script>
<script src="/frontend/js/ui.js"></script>
<script src="/frontend/js/nav.js"></script>
<script src="/frontend/js/admin.js"></script>
</body>
</html>
