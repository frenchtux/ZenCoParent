# ─────────────────────────────────────────────────────────────────────────────
# ZenCoParent — déploiement depuis GitHub
#
# Sources clonées depuis GitHub au démarrage, pas de bind-mount local.
#
# Usage :
#   docker compose -f docker-compose.github.yml --env-file .env up -d
#
# Variables requises dans .env :
#   GITHUB_REPO     ex: frenchtux/ZenCoParent (ou URL complète HTTPS/SSH)
#   GITHUB_REF      branche / tag / commit  (défaut: main)
#   GITHUB_TOKEN    Personal Access Token si repo privé (optionnel)
#   APP_PORT        port HTTP exposé (défaut: 8061)
#   DB_*            credentials PostgreSQL
#   (voir .env.example pour toutes les variables)
# ─────────────────────────────────────────────────────────────────────────────

x-app-code: &app-code
  image: zencoparent-app:latest
  volumes:
    - app_code:/var/www/html
    - zencoparent_storage:/var/www/html/storage

services:

  # ── Clone / pull depuis GitHub (init container) ──────────────────────────────
  # Clone le repo (ou fait un git pull si déjà présent) puis lance
  # composer install --no-dev.
  git-clone:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.github
    volumes:
      - app_code:/var/www/html
    environment:
      GITHUB_REPO:  ${GITHUB_REPO:?GITHUB_REPO est requis}
      GITHUB_REF:   ${GITHUB_REF:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command: ["/usr/local/bin/git-clone.sh"]
    restart: "no"
    networks:
      - zencoparent_net

  # ── nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8061}:80"
    depends_on:
      php:
        condition: service_started
    volumes:
      - app_code:/var/www/html:ro
      # La conf nginx est embarquée dans l'image (copiée par Dockerfile.github).
      # Surcharge possible ici :
      # - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zencoparent_net

  # ── php-fpm ──────────────────────────────────────────────────────────────────
  php:
    <<: *app-code
    restart: unless-stopped
    env_file:
      - ${ZENCO_ENV_FILE:-.env}
    environment:
      ZENCO_ENV_FILE: ${ZENCO_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    networks:
      - zencoparent_net

  # ── Migrations (init container) ───────────────────────────────────────────────
  migrate:
    <<: *app-code
    env_file:
      - ${ZENCO_ENV_FILE:-.env}
    environment:
      ZENCO_ENV_FILE: ${ZENCO_ENV_FILE:-.env}
    command: ["php", "/var/www/html/database/migrations/migrate.php"]
    depends_on:
      postgres:
        condition: service_healthy
      git-clone:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - zencoparent_net

  # ── Seeder (init container) ───────────────────────────────────────────────────
  seed:
    <<: *app-code
    env_file:
      - ${ZENCO_ENV_FILE:-.env}
    environment:
      ZENCO_ENV_FILE: ${ZENCO_ENV_FILE:-.env}
    command: ["php", "/var/www/html/seed_admin.php"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - zencoparent_net

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-zencoparent}
      POSTGRES_USER:     ${DB_USERNAME:-zencoparent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - zencoparent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zencoparent} -d ${DB_DATABASE:-zencoparent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zencoparent_net

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - zencoparent_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zencoparent_net

  # ── MinIO ─────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - zencoparent_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - zencoparent_net

  # ── MinIO bucket init (init container) ───────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        echo 'MinIO bucket ready.'
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-zencoparent}
    restart: "no"
    networks:
      - zencoparent_net

networks:
  zencoparent_net:
    driver: bridge

volumes:
  app_code:          # sources clonées depuis GitHub
  zencoparent_pgdata:
  zencoparent_redis:
  zencoparent_minio:
  zencoparent_storage:
